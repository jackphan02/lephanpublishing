<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excel Battery Report | V&V Automation</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Verdana, Arial, sans-serif;
            background-color: #e9f6ea;
            color: #222;
            line-height: 1.6;
        }

        /* ==============================
           Header
           ============================== */

        header {
            background-color: #1f3b5b;
            color: white;
            padding: 20px 0;
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 30px;
        }

        .site-title {
            font-size: 24px;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;

            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* ==============================
           Main Content
           ============================== */

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .content-card {
            background-color: white;
            border: 1px solid #cfd8dc;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 30px;
            color: #15569b;
            font-size: 30px;
            text-align: center;
        }

        /* ==============================
           Excel Screenshot
           ============================== */

        .excel-screenshot {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;

            border: 1px solid #bbb;
            border-radius: 5px;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.10);
        }

        /* ==============================
           Bottom Buttons
           ============================== */

        .bottom-buttons {
            margin-top: 35px;
            text-align: center;
        }

        .download-button {
            display: inline-block;
            padding: 13px 26px;

            background-color: #66a96b;
            color: white;

            border-radius: 5px;

            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .download-button:hover {
            background-color: #57945c;
        }

        .back-link {
            display: block;
            margin-top: 25px;

            color: #15569b;
            font-weight: bold;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        /* ==============================
           Footer
           ============================== */

        footer {
            margin-top: 50px;
            padding: 24px;

            background-color: #1f3b5b;
            color: white;

            text-align: center;
            font-size: 14px;
        }

        /* ==============================
           Mobile
           ============================== */

        @media (max-width: 800px) {

            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }

            nav ul {
                gap: 14px;
            }

            .content-card {
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }
        }

    </style>

</head>


<body>

    <!-- ==========================================
         Header
         ========================================== -->

    <header>

        <div class="header-inner">

            <div class="site-title">
                LePhan Publishing
            </div>

            <nav aria-label="Main navigation">

                <ul>

                    <li>
                        <a href="/index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="/ContactInfo/ContactPage.html">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ==========================================
         Main Content
         ========================================== -->

    <main>

        <div class="content-card">

            <h1>
                Excel Battery Report - FAIL
            </h1>


            <!-- Excel Screenshot -->

            <img class="excel-screenshot"
                 src="ExcelDemoBattery.png"
                 alt="Excel Battery Test Report">


            <!-- Bottom Buttons -->

            <div class="bottom-buttons">

                <a class="download-button"
                   href="../ExampleExcelFiles/Battery_Test_Report_BATT-2026-08-12_11-59-36_FAIL.xlsx"
                   download>

                    Download This Excel Report (.xlsx)

                </a>


                <a class="back-link"
                   href="../SampleReports.html">

                    &larr; Back to Sample Reports

                </a>

            </div>

        </div>

    </main>


    <!-- ==========================================
         Footer
         ========================================== -->

    <footer>
        &copy; 2026 LePhan Publishing
    </footer>

</body>

</html>
