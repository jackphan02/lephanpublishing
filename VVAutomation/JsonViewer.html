<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>V&amp;V JSON Report | LePhan Publishing</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Verdana, Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid #d9dee5;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 22px 28px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .site-title {
            font-size: 27px;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 45px 28px 60px;
        }

        .section {
            background: #ffffff;
            border: 1px solid #d9dee5;
            border-radius: 8px;
            padding: 28px 32px;
        }

        h1 {
            margin-top: 0;
            color: #164f8c;
            font-size: 28px;
        }

        .json-file-name {
            margin-bottom: 18px;
            color: #555;
            font-size: 14px;
        }

        .json-content {
            font-family: Consolas, "Courier New", monospace;
            font-size: 16px;
            line-height: 1.6;
            background: #f5f7fa;
            padding: 20px;
            border: 1px solid #d9dee5;
            border-radius: 6px;
            white-space: pre-wrap;
            overflow-x: auto;
        }

        .button-row {
            margin-top: 25px;
        }

        .button {
            display: inline-block;
            padding: 10px 18px;
            background: #66a96b;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #57945c;
            border-radius: 5px;
        }

        .button:hover {
            background: #57945c;
        }

        .error {
            color: #a12622;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            border-top: 1px solid #d9dee5;
            background: #ffffff;
            text-align: center;
            padding: 22px;
            font-size: 13px;
            color: #666;
        }

    </style>
</head>


<body>

<header>

    <div class="header-inner">

        <div class="site-title">
            LePhan Publishing
        </div>

    </div>

</header>


<main>

    <section class="section">

        <h1>V&amp;V JSON Report</h1>

        <div class="json-file-name" id="fileName">
            Loading JSON report...
        </div>

        <pre class="json-content" id="jsonContent">Loading...</pre>

        <div class="button-row">

            <a class="button"
               href="SampleReports.html">
                &larr; Back to Sample Reports
            </a>

        </div>

    </section>

</main>


<footer>

    LePhan Publishing V&amp;V Automation

</footer>


<script>

    const parameters = new URLSearchParams(window.location.search);

    const file = parameters.get("file");

    const fileName = document.getElementById("fileName");
    const jsonContent = document.getElementById("jsonContent");


    if (file) {

        fileName.textContent = file;

        fetch("ExampleJsonFiles/" + file)

            .then(response => {

                if (!response.ok) {
                    throw new Error("Unable to load JSON file.");
                }

                return response.json();

            })

            .then(data => {

                jsonContent.textContent =
                    JSON.stringify(data, null, 4);

            })

            .catch(error => {

                jsonContent.textContent =
                    "Unable to load the JSON report.";

                jsonContent.classList.add("error");

            });

    }
    else {

        fileName.textContent = "No JSON file selected.";

        jsonContent.textContent =
            "Please select a JSON report from the Sample Reports page.";

    }

</script>


</body>
</html>
